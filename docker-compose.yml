services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
      target: bridge
    # Bridge stays on the compose network only — do not publish 8792 to the host.
    expose:
      - "8792"
    environment:
      CURSOR_SDK_BRIDGE_HOST: "0.0.0.0"
      CURSOR_SDK_BRIDGE_PORT: "8792"
      CURSOR_SDK_BRIDGE_TOKEN: ${CURSOR_SDK_BRIDGE_TOKEN:-}
      CURSOR_SDK_BRIDGE_RUN_TIMEOUT_MS: ${CURSOR_SDK_BRIDGE_RUN_TIMEOUT_MS:-180000}
      CURSOR_SDK_CONTEXT_WINDOW_REFRESH_MS: ${CURSOR_SDK_CONTEXT_WINDOW_REFRESH_MS:-900000}
      CURSOR_SDK_WORKING_DIRECTORY: ${CURSOR_SDK_WORKING_DIRECTORY:-/workspace}
      CURSOR_SDK_CONTEXT_WINDOWS_FILE: /context-cache/context-windows.json
    volumes:
      # Host project tree the agent can read/write via SDK tools.
      - ${CURSOR_SDK_WORKSPACE_HOST:-.}:/workspace
      - context-windows:/context-cache
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "127.0.0.1:${PORT:-8788}:8788"
    environment:
      HOST: "0.0.0.0"
      PORT: "8788"
      CURSOR_SDK_BRIDGE_URL: http://bridge:8792/sdk
      CURSOR_SDK_BRIDGE_TOKEN: ${CURSOR_SDK_BRIDGE_TOKEN:-}
      CURSOR_SDK_BRIDGE_REQUEST_TIMEOUT_MS: ${CURSOR_SDK_BRIDGE_REQUEST_TIMEOUT_MS:-900000}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-10000}
      CURSOR_SDK_WORKING_DIRECTORY: ${CURSOR_SDK_WORKING_DIRECTORY:-/workspace}
      CURSOR_SDK_CONTEXT_WINDOWS_FILE: /context-cache/context-windows.json
      COMPOSER_API_MODELS: ${COMPOSER_API_MODELS:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
    depends_on:
      - bridge
    volumes:
      - context-windows:/context-cache
    restart: unless-stopped

volumes:
  context-windows:
